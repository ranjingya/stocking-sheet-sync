[supervisord]
nodaemon=true
logfile=/dev/null
pidfile=/tmp/stocking-supervisord.pid

[program:web]
command=/app/.venv/bin/gunicorn -c /app/gunicorn.py stocking_sheet_sync.entrypoints.web:create_app()
directory=/app
autostart=true
autorestart=true
startsecs=0
stopasgroup=true
killasgroup=true
stopwaitsecs=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:worker]
command=/app/.venv/bin/stocking-sheet-sync worker
directory=/app
autostart=true
autorestart=true
startsecs=0
stopasgroup=true
killasgroup=true
stopwaitsecs=300
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
