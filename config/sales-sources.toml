# 统计区间为预估日前最近 30 个完整自然日，采用业务日期。
[matching]
header_rows = 3
sku_headers = ["商品编码", "SKU编码", "条形码"]
style_headers = ["款式编码"]
name_headers = ["商品名称"]
spec_headers = ["颜色规格", "规格名称"]
market_headers = ["市场部"]
combined_headers = ["市场部其它", "市场部其他"]

[catalog]
table = "std_api_jstbz_product_spec_info_f"
fields = { sku = "spec_code", style = "product_code", name = "product_name", spec = "spec_name" }
filters = { data_source = ["聚水潭标准API"], company = ["公司"] }

[[platforms]]
id = "jd_self"
name = "京东自营"
kind = "snapshot"
table = "bwd_rpa_jd_inventory_product_detail"
reference_table = "ads_rpa_jd_inventory_product_detail"
base_table_id = "tbl1VI5nK0RmGSkT"
source_view = "MySQL ads_rpa_jd_inventory_product_detail"
fields = { sku = "barcode", date = "dt", quantity = "outbound_30d", row_id = "sku_id" }
filters = { shop_name = ["kocotree京东自营旗舰店"] }
sales_headers = ["自营近30天", "京东自营近30天", "京东自营近30天销量"]
demand_headers = ["京东自营"]

[[platforms]]
id = "jd_pop"
name = "京东POP"
