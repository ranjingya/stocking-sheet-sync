# 预测专用来源；连接使用项目内 WAREHOUSE_* 配置。
[catalog]
table = "std_api_jstbz_product_spec_info_f"
fields = { sku = "spec_code", style = "product_code", name = "product_name", spec = "spec_name", labels = "labels" }
filters = { data_source = ["聚水潭标准API"], company = ["公司"] }

# dt 对应业务日；数据通常在次日创建，不能再将 dt 减一天。
# 日值与30天快照有差异时，30天输入标记待核对。
[daily.jd_self]
id = "jd_self"
kind = "daily"
table = "bwd_rpa_jd_inventory_product_detail"
fields = { sku = "barcode", date = "dt", quantity = "outbound_yesterday", row_id = "sku_id", rolling_30 = "outbound_30d" }
filters = { shop_name = ["kocotree京东自营旗舰店"] }
business_date_offset_days = 0

[company]
status = "pending_scope_confirmation"
