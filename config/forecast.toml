# 老款通用预测规则，月份和日期均使用业务日期。
[seasons]
summer_labels = ["夏款"]
winter_labels = ["秋冬款"]
all_year_labels = ["四季款"]
summer_end = [8, 31]
winter_end = [1, 31]

[fallback]
sku_count_below = 10
sales_below = 20

# 来源表前部的全公司去年生命周期销量，周期原文仅作证据保存。
[company_sheet]
group_row = 1
header_row = 3
group_pattern = "(?:[0-9Xx]{2,4}年)?销售总数"
headers = ["全公司去年生命周期销量", "全公司生命周期销量"]
