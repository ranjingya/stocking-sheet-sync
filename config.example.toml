# 飞书开放平台
[feishu]
api_base_url = "https://open.feishu.cn"

# 源多维表
[source]
app_token = "xxxxxxxxxxxxxxxx"
table_id = "tblxxxxxxxxxxxxxx"
view_id = ""
link_field_name = "下单表格"

# 只处理符合这些条件的记录；不需要过滤时填写空对象 {}
required_fields = { "状态" = "需求收集", "下单状态" = "未完成" }

# 已接管表格只有在记录仍符合这些条件时才继续监听
monitor_required_fields = { "状态" = "需求收集" }
monitor_days = 3

# 目标共享文件夹
[target]
folder_token = "xxxxxxxxxxxxxxxx"
copy_name_prefix = "市场部-"

# 通知接收人，必须是当前自建应用体系下的 open_id
[notifications]
open_ids = [
  "ou_xxxxxxxxxxxxxxxx",
  "ou_yyyyyyyyyyyyyyyy",
]

# Redis String 键命名空间；旧 Hash 仅用于自动迁移
[redis]
key_prefix = "ss"
legacy_hash_key = "stocking-sheet-sync:synced"

# Webhook 对外服务地址
[web]
public_base_url = "https://stock-sync.example.com"

# 程序运行参数
[runtime]
poll_interval_minutes = 30
change_check_interval_minutes = 1
change_quiet_minutes = 10
request_timeout_seconds = 15
max_retries = 3
log_level = "INFO"
